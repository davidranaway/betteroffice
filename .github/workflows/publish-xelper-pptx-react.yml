name: Publish xelper PPTX prerelease set

on:
  push:
    tags:
      - '@davidranaway/betteroffice-pptx-react@*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish xelper PPTX release set
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.3"

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: ./.github/actions/wasm-toolchain

      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-pack@0.15.0

      - name: Validate tag and version
        run: bun scripts/package-xelper-pptx-react.mjs --validate-tag "$GITHUB_REF_NAME"

      - name: Install locked tooling dependencies
        run: bun install --frozen-lockfile

      - name: Test packaging contract
        run: |
          cd "$RUNNER_TEMP"
          bun test "$GITHUB_WORKSPACE/scripts/package-xelper-pptx-react.test.ts"

      - name: Build, test, audit, and inspect package
        run: bun scripts/package-xelper-pptx-react.mjs

      - name: Refuse an npm token
        env:
          TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            echo "::error::NPM_TOKEN is set. This workflow publishes through Trusted Publishing only."
            exit 1
          fi

      - name: Require bootstrapped Trusted Publishing packages
        run: |
          if ! npm view '@davidranaway/betteroffice-pptx' name >/dev/null 2>&1; then
            echo "::error::The core package is not bootstrapped. Complete the documented bootstrap and Trusted Publisher setup before pushing the release tag."
            exit 1
          fi
          if ! npm view '@davidranaway/betteroffice-pptx-react' version >/dev/null 2>&1; then
            echo "::error::The React package no longer resolves on npm."
            exit 1
          fi

      - name: Require both immutable registry targets to be unused
        run: |
          for target in \
            '@davidranaway/betteroffice-pptx@0.5.1-xelper.1' \
            '@davidranaway/betteroffice-pptx-react@0.5.1-xelper.5'
          do
            if npm view "$target" version >/dev/null 2>&1; then
              echo "::error::Registry target already exists: $target"
              exit 1
            fi
          done

      - name: Publish core first with provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          tarball=$(node -e "const p=require('./xelper-prereleases/pptx-react/artifacts/provenance.json'); process.stdout.write('xelper-prereleases/pptx-react/'+p.tarballs.core.file)")
          test -f "$tarball"
          npm publish "$tarball" --access public --tag xelper --provenance

      - name: Publish React second with provenance
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: |
          tarball=$(node -e "const p=require('./xelper-prereleases/pptx-react/artifacts/provenance.json'); process.stdout.write('xelper-prereleases/pptx-react/'+p.tarballs.react.file)")
          test -f "$tarball"
          npm publish "$tarball" --access public --tag xelper --provenance
